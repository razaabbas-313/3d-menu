server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 30m;

  # API and uploaded files are served by the Spring Boot container.
  location /api/     { proxy_pass http://backend:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  location /uploads/ { proxy_pass http://backend:8080; proxy_set_header Host $host; }

  # Hashed build assets can be cached forever.
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }

  # Single-page app: unknown paths (/m/my-restaurant, /app/menu, ...) serve index.html.
  location / { try_files $uri /index.html; }
}
