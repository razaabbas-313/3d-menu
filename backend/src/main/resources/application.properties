spring.application.name=atelier-ar-api
server.port=${PORT:8080}
# Needed so client IPs (rate limiting) are correct behind nginx / a load balancer.
server.forward-headers-strategy=framework

# ---- Database -------------------------------------------------------------
# Default: embedded H2 file database, so the project runs with zero setup.
# For PostgreSQL set DB_URL, DB_USERNAME and DB_PASSWORD (see .env.example).
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/atelier;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Schema validation ensures Hibernate matches Flyway migrations
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- Uploads & Storage ----------------------------------------------------
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=52MB
app.storage.provider=${STORAGE_PROVIDER:local}
app.storage.dir=${STORAGE_DIR:uploads}
app.storage.max-model-mb=${MAX_MODEL_MB:15}
app.storage.quota-mb=${STORAGE_QUOTA_MB:100}

# AWS S3 Settings (Used when STORAGE_PROVIDER=s3)
aws.region=${AWS_REGION:us-east-1}
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
app.storage.s3.bucket=${S3_BUCKET:}
app.storage.s3.public-base-url=${S3_PUBLIC_BASE_URL:}

# ---- Security -------------------------------------------------------------
# MUST be overridden in production (32+ characters).
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
app.jwt.ttl-days=${JWT_TTL_DAYS:14}
# Comma-separated list of browser origins allowed to call the API directly.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://*.vercel.app,https://*.onrender.com,https://3d-menu-three.vercel.app}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
