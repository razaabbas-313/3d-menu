name: Render Backend Keep-Alive

on:
  schedule:
    # Run every 10 minutes to reliably prevent Render free instance from spinning down
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          RENDER_URL="${{ secrets.RENDER_API_URL }}"
          if [ -z "$RENDER_URL" ]; then
            RENDER_URL="https://atelier-api-jyit.onrender.com"
          fi
          echo "Pinging $RENDER_URL/health ..."
          curl -s -f -m 15 "$RENDER_URL/health" || curl -s -f -m 15 "$RENDER_URL/actuator/health" || echo "Ping attempted (backend may be spinning up)"
